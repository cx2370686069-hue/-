<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>用户端地图选点</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f7f8fa;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      #mapContainer {
        position: fixed;
        inset: 0;
      }

      .bottom-sheet {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        height: min(48vh, 420px);
        min-height: 320px;
        background: rgba(255, 255, 255, 0.98);
        border-radius: 20px 20px 0 0;
        box-shadow: 0 -10px 28px rgba(0, 0, 0, 0.12);
        overflow: hidden;
      }

      .sheet-handle {
        width: 42px;
        height: 4px;
        border-radius: 999px;
        background: #e6e6e6;
        margin: 8px auto 4px;
        flex-shrink: 0;
      }

      .search-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 44px;
        margin: 8px 16px 10px;
        padding: 0 12px;
        border-radius: 10px;
        background: #f5f5f5;
        box-shadow: none;
        flex-shrink: 0;
      }

      .search-icon {
        color: #999;
        font-size: 16px;
        line-height: 1;
      }

      .search-input {
        flex: 1;
        height: 100%;
        border: 0;
        outline: none;
        background: transparent;
        font-size: 15px;
        color: #222;
      }

      .search-btn {
        display: none;
      }

      .suggest-panel {
        display: block;
        flex: 1;
        min-height: 0;
        background: transparent;
        overflow: hidden;
      }

      .suggest-list {
        height: 100%;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .suggest-item {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid #f1f1f1;
        background: #fff;
      }

      .suggest-item.active {
        background: #fff8f4;
      }

      .suggest-item:last-child {
        border-bottom: 0;
      }

      .suggest-main {
        flex: 1;
        min-width: 0;
      }

      .suggest-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .suggest-title {
        font-size: 14px;
        font-weight: 600;
        line-height: 1.3;
        color: #222;
      }

      .suggest-address {
        margin-top: 2px;
        font-size: 12px;
        line-height: 1.35;
        color: #888;
      }

      .suggest-check {
        flex-shrink: 0;
        color: #ff6b35;
        font-size: 16px;
        font-weight: 700;
        line-height: 1;
      }

      .panel-state {
        padding: 16px;
        font-size: 13px;
        line-height: 1.6;
        color: #888;
        text-align: left;
      }

      .center-pin {
        position: fixed;
        left: 50%;
        top: 38%;
        width: 30px;
        height: 42px;
        margin-left: -15px;
        margin-top: -42px;
        z-index: 12;
        pointer-events: none;
      }

      .center-pin-tip {
        position: absolute;
        left: 50%;
        top: 36px;
        width: 2px;
        height: 2px;
        margin-left: -1px;
        margin-top: -1px;
        opacity: 0;
      }

      .center-pin::before {
        content: '';
        display: block;
        width: 30px;
        height: 30px;
        border-radius: 50% 50% 50% 0;
        background: #ff6b35;
        transform: rotate(-45deg);
        box-shadow: 0 6px 14px rgba(255, 107, 53, 0.28);
      }

      .center-pin::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 10px;
        height: 10px;
        margin-left: -5px;
        margin-top: -11px;
        border-radius: 50%;
        background: #fff;
      }

      .sheet-footer {
        padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
        background: #fff;
        border-top: 1px solid #f2f2f2;
        flex-shrink: 0;
      }

      .confirm-btn {
        width: 100%;
        height: 46px;
        margin-top: 0;
        border: 0;
        border-radius: 23px;
        background: #ff6b35;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
      }

      .confirm-btn[disabled] {
        background: #ffb49f;
      }

      .loading-mask {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.72);
        font-size: 14px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div id="mapContainer"></div>
    <div class="center-pin">
      <div class="center-pin-tip"></div>
    </div>
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="search-bar">
        <span class="search-icon">⌕</span>
        <input
          id="searchInput"
          class="search-input"
          type="search"
          placeholder="搜索地点"
          autocomplete="off"
        />
        <button id="searchBtn" class="search-btn" type="button">搜索</button>
      </div>
      <div id="suggestPanel" class="suggest-panel">
        <div id="suggestState" class="panel-state">输入地址后会显示联想位置</div>
        <div id="suggestList" class="suggest-list"></div>
      </div>
      <div class="sheet-footer">
        <button id="confirmBtn" class="confirm-btn" type="button" disabled>确认位置</button>
      </div>
    </div>
    <div id="loadingMask" class="loading-mask">正在加载地图...</div>

    <script src="https://doc.dcloud.net.cn/uni.webview.1.5.6.js"></script>
    <script>
      ;(function () {
        var DEFAULT_CENTER = { lat: 32.1313, lng: 115.654 }
        var map = null
        var isDragging = false
        var lastSearchToken = 0
        var lastCenterRefreshToken = ''
        var searchTimer = null
        var selectedLocation = null
        var centerSyncTimer = null
        var zoomTailSyncTimer = null
        var lastZoomLevel = 17
        var DEBUG_SERVER_URL = 'http://192.168.1.9:7777/event'
        var DEBUG_SESSION_ID = 'map-zoom-out-drift'
        var theme = getQuery('theme') === 'town' ? 'town' : 'county'
        var currentTownName = String(getQuery('current_town_name') || '').trim()
        var currentTownCode = String(getQuery('current_town_code') || '').trim()
        // 这里和前端 APP 地图页共用同一个桥接 key。
        // 如果 web-view 的 postMessage 因平台兼容问题没回到宿主，就退回到 plus.storage 兜底。
        var APP_MAP_PICKER_BRIDGE_STORAGE_KEY = '__user_map_picker_bridge__'
        var loadingMaskEl = document.getElementById('loadingMask')
        var confirmBtnEl = document.getElementById('confirmBtn')
        var searchInputEl = document.getElementById('searchInput')
        var searchBtnEl = document.getElementById('searchBtn')
        var suggestPanelEl = document.getElementById('suggestPanel')
        var suggestStateEl = document.getElementById('suggestState')
        var suggestListEl = document.getElementById('suggestList')

        function getQuery(name) {
          var pairs = window.location.search.slice(1).split('&')
          for (var i = 0; i < pairs.length; i += 1) {
            if (!pairs[i]) continue
            var parts = pairs[i].split('=')
            if (decodeURIComponent(parts[0] || '') === name) {
              return decodeURIComponent(parts.slice(1).join('=') || '')
            }
          }
          return ''
        }

        function toFiniteNumber(value) {
          var num = Number(value)
          return isFinite(num) ? num : null
        }

        function isUsableCoordinate(lng, lat) {
          var targetLng = toFiniteNumber(lng)
          var targetLat = toFiniteNumber(lat)
          if (targetLng == null || targetLat == null) return false
          if (targetLng === 0 && targetLat === 0) return false
          if (targetLat < 3 || targetLat > 55 || targetLng < 73 || targetLng > 136) return false
          return true
        }

        function outOfChina(lng, lat) {
          return lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271
        }

        function transformLat(x, y) {
          var ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x))
          ret += ((20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0) / 3.0
          ret += ((20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin((y / 3.0) * Math.PI)) * 2.0) / 3.0
          ret += ((160.0 * Math.sin((y / 12.0) * Math.PI) + 320.0 * Math.sin((y * Math.PI) / 30.0)) * 2.0) / 3.0
          return ret
        }

        function transformLng(x, y) {
          var ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x))
          ret += ((20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0) / 3.0
          ret += ((20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin((x / 3.0) * Math.PI)) * 2.0) / 3.0
          ret += ((150.0 * Math.sin((x / 12.0) * Math.PI) + 300.0 * Math.sin((x / 30.0) * Math.PI)) * 2.0) / 3.0
          return ret
        }

        function gcj02ToWgs84(lng, lat) {
          if (!isFinite(lng) || !isFinite(lat)) {
            return { lng: null, lat: null }
          }
          if (outOfChina(lng, lat)) {
            return { lng: lng, lat: lat }
          }
          var a = 6378245.0
          var ee = 0.00669342162296594323
          var dLat = transformLat(lng - 105.0, lat - 35.0)
          var dLng = transformLng(lng - 105.0, lat - 35.0)
          var radLat = (lat / 180.0) * Math.PI
          var magic = Math.sin(radLat)
          magic = 1 - ee * magic * magic
          var sqrtMagic = Math.sqrt(magic)
          dLat = (dLat * 180.0) / (((a * (1 - ee)) / (magic * sqrtMagic)) * Math.PI)
          dLng = (dLng * 180.0) / ((a / sqrtMagic) * Math.cos(radLat) * Math.PI)
          var mgLat = lat + dLat
          var mgLng = lng + dLng
          return {
            lng: lng * 2 - mgLng,
            lat: lat * 2 - mgLat
          }
        }

        function setLoading(show) {
          loadingMaskEl.style.display = show ? 'flex' : 'none'
        }

        function setStatus(text) {
          return text
        }

        function setAddress(text) {
          return text
        }

        function setCoords(latitude, longitude) {
          return latitude == null || longitude == null ? '' : String(longitude) + ',' + String(latitude)
        }

        function setConfirmEnabled(enabled) {
          confirmBtnEl.disabled = !enabled
        }

        function showSuggestPanel(show) {
          suggestPanelEl.style.display = 'block'
        }

        function setSuggestState(text) {
          suggestStateEl.textContent = text || ''
          suggestStateEl.style.display = text ? 'block' : 'none'
        }

        function clearSuggestList() {
          suggestListEl.innerHTML = ''
        }

        function wait(ms) {
          return new Promise(function (resolve) {
            setTimeout(resolve, ms)
          })
        }

        // #region debug-point common:report
        function reportDebugPoint(hypothesisId, location, msg, data) {
          fetch(DEBUG_SERVER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              sessionId: DEBUG_SESSION_ID,
              runId: 'pre-fix',
              hypothesisId: hypothesisId,
              location: location,
              msg: '[DEBUG] ' + msg,
              data: data || {},
              ts: Date.now()
            })
          }).catch(function () {})
        }
        // #endregion

        function buildSelectedDisplayItem() {
          if (!selectedLocation) return null
          return {
            title: String(selectedLocation.title || selectedLocation.name || selectedLocation.address || '已选位置').trim(),
            address: String(selectedLocation.address || selectedLocation.title || selectedLocation.name || '').trim(),
            town: String(selectedLocation.town || '').trim(),
            longitude: selectedLocation.longitude,
            latitude: selectedLocation.latitude,
            gcj_longitude: selectedLocation.gcj_longitude,
            gcj_latitude: selectedLocation.gcj_latitude,
            _selected: true
          }
        }

        function isSameSuggestionItem(a, b) {
          if (!a || !b) return false
          var aLng = toFiniteNumber(a.gcj_longitude != null ? a.gcj_longitude : a.longitude)
          var aLat = toFiniteNumber(a.gcj_latitude != null ? a.gcj_latitude : a.latitude)
          var bLng = toFiniteNumber(b.gcj_longitude != null ? b.gcj_longitude : b.longitude)
          var bLat = toFiniteNumber(b.gcj_latitude != null ? b.gcj_latitude : b.latitude)
          if (aLng != null && aLat != null && bLng != null && bLat != null) {
            return Math.abs(aLng - bLng) < 0.00001 && Math.abs(aLat - bLat) < 0.00001
          }
          return String(a.title || a.name || a.address || '').trim() === String(b.title || b.name || b.address || '').trim() &&
            String(a.address || '').trim() === String(b.address || '').trim()
        }

        function isActiveSuggestionItem(item) {
          if (!item) return false
          if (item._selected) return true
          return isSameSuggestionItem(item, selectedLocation)
        }

        function buildDisplayItems(items) {
          var result = []
          var seen = {}

          // 候选地点列表这里要把乡镇名提前展示出来。
          // 不然用户拖点时看到的只是“青松 / 赵西家”这类局部地名，无法确认是不是郭陆滩镇范围内。
          function buildDisplayAddress(item) {
            var baseAddress = String(item && (item.address || item.title || item.name) || '').trim()
            if (theme !== 'town') {
              return baseAddress
            }
            var townText = String(item && item.town || '').trim() || extractTown(baseAddress)
            if (!townText) {
              return baseAddress
            }
            if (!baseAddress) {
              return townText
            }
            if (baseAddress.indexOf(townText) !== -1) {
              return baseAddress
            }
            return townText + ' · ' + baseAddress
          }

          function pushItem(item, forceSelected) {
            if (!item) return
            var normalized = Object.assign({}, item)
            if (forceSelected) {
              normalized._selected = true
            }
            normalized.display_address = buildDisplayAddress(normalized)
            var lng = toFiniteNumber(normalized.gcj_longitude != null ? normalized.gcj_longitude : normalized.longitude)
            var lat = toFiniteNumber(normalized.gcj_latitude != null ? normalized.gcj_latitude : normalized.latitude)
            var key = [
              String(normalized.title || normalized.name || normalized.address || '').trim(),
              String(normalized.display_address || normalized.address || '').trim(),
              lng != null ? lng.toFixed(5) : '',
              lat != null ? lat.toFixed(5) : ''
            ].join('|')
            if (seen[key]) {
              if (normalized._selected) {
                seen[key]._selected = true
              }
              return
            }
            seen[key] = normalized
            result.push(normalized)
          }

          pushItem(buildSelectedDisplayItem(), true)
          ;(items || []).forEach(function (item) {
            pushItem(item, false)
          })
          return result
        }

        function escapeHtml(text) {
          return String(text || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;')
        }

        function unwrapResponse(payload) {
          if (payload && typeof payload === 'object') {
            if (Array.isArray(payload.data)) {
              return payload.data
            }
            if (payload.code === 200 && payload.data !== undefined) {
              return payload.data
            }
          }
          return payload
        }

        function apiGet(url, params) {
          var query = []
          Object.keys(params || {}).forEach(function (key) {
            var value = params[key]
            if (value === '' || value === null || value === undefined) return
            query.push(encodeURIComponent(key) + '=' + encodeURIComponent(String(value)))
          })
          var target = url + (query.length ? '?' + query.join('&') : '')
          return fetch(target, {
            method: 'GET',
            credentials: 'include'
          }).then(function (response) {
            return response.json().then(function (json) {
              if (!response.ok) {
                throw new Error((json && json.message) || '请求失败')
              }
              return unwrapResponse(json)
            })
          })
        }

        function extractReverseAddress(payload) {
          var result = payload && payload.result ? payload.result : {}
          var component = result.address_component || result.addressComponent || {}
          var address =
            (result.formatted_addresses && (result.formatted_addresses.recommend || result.formatted_addresses.rough)) ||
            result.formatted_address ||
            result.address ||
            ''
          return {
            address: String(address || '').trim(),
            province: String(component.province || '').trim(),
            city: String(component.city || '').trim(),
            district: String(component.district || component.county || '').trim(),
            town: String(component.town || component.township || '').trim(),
            street: String(
              (component.street_number && component.street_number.street) || component.street || component.road || ''
            ).trim()
          }
        }

        function extractTown(text) {
          var value = String(text || '').trim()
          if (!value) return ''
          var match = value.match(/([^省市区县]{1,20}(?:镇|乡|街道))/)
          return match ? String(match[1] || '').trim() : ''
        }

        // 腾讯逆地理在乡镇道路、空地附近经常只能回“固始县”这一层。
        // 这里补一条“按坐标反查平台服务区域”的链路，保证地图页能稳定拿到乡镇名和乡镇编码。
        function normalizeResolvedTownArea(payload) {
          var area = payload && typeof payload === 'object' ? payload : {}
          var townName = String(area.town_name || area.area_name || area.town || '').trim()
          var townCode = String(area.town_code || area.area_code || '').trim()
          if (!townName && !townCode) {
            return null
          }
          return {
            town_name: townName,
            town_code: townCode
          }
        }

        // 这里保留一份固始县乡镇兜底表。
        // 原因是地图移动过程中，腾讯逆地理和坐标反查偶尔会漏掉镇名。
        // 只要当前还是乡镇场景，就再用本地表从地址文本里补一次乡镇，避免因为“少了郭陆滩镇”直接不能下单。
        var TOWN_FALLBACK_AREAS = [
          { area_code: 'gs_town_001', area_name: '陈淋子镇' },
          { area_code: 'gs_town_002', area_name: '祖师庙镇' },
          { area_code: 'gs_town_003', area_name: '武庙集镇' },
          { area_code: 'gs_town_004', area_name: '段集镇' },
          { area_code: 'gs_town_005', area_name: '方集镇' },
          { area_code: 'gs_town_006', area_name: '郭陆滩镇' },
          { area_code: 'gs_town_007', area_name: '汪棚镇' },
          { area_code: 'gs_town_008', area_name: '胡族铺镇' },
          { area_code: 'gs_town_009', area_name: '李店镇' },
          { area_code: 'gs_town_010', area_name: '往流镇' },
          { area_code: 'gs_town_011', area_name: '三河尖镇' },
          { area_code: 'gs_town_012', area_name: '蒋集镇' },
          { area_code: 'gs_town_013', area_name: '陈集镇' },
          { area_code: 'gs_town_014', area_name: '泉河铺镇' },
          { area_code: 'gs_town_015', area_name: '分水亭镇' },
          { area_code: 'gs_town_016', area_name: '沙河铺镇' },
          { area_code: 'gs_town_017', area_name: '张广庙镇' },
          { area_code: 'gs_town_018', area_name: '石佛店镇' },
          { area_code: 'gs_town_019', area_name: '黎集镇' },
          { area_code: 'gs_town_020', area_name: '草庙集镇' },
          { area_code: 'gs_town_021', area_name: '马堽集镇' },
          { area_code: 'gs_town_022', area_name: '徐集镇' }
        ]

        function normalizeTownName(name) {
          return String(name || '')
            .trim()
            .replace(/\s+/g, '')
            .replace(/^河南省/, '')
            .replace(/^信阳市/, '')
            .replace(/^固始县/, '')
            .replace(/(街道办事处|办事处|街道|镇|乡)$/u, '')
        }

        function resolveTownFromText(text, townList) {
          var content = normalizeTownName(text)
          var list = Array.isArray(townList) ? townList : TOWN_FALLBACK_AREAS
          if (!content) return null
          for (var i = 0; i < list.length; i += 1) {
            var item = list[i]
            if (content.indexOf(normalizeTownName(item && item.area_name)) !== -1) {
              return item
            }
          }
          return null
        }

        function deriveResolvedTownArea(reverseInfo, items, resolvedTownArea) {
          if (resolvedTownArea && (resolvedTownArea.town_name || resolvedTownArea.town_code)) {
            return resolvedTownArea
          }
          var candidates = []
          if (reverseInfo) {
            candidates.push(reverseInfo.town)
            candidates.push(reverseInfo.address)
          }
          ;(Array.isArray(items) ? items : []).forEach(function (item) {
            candidates.push(item && item.town)
            candidates.push(item && item.address)
            candidates.push(item && item.title)
            candidates.push(item && item.name)
          })
          for (var i = 0; i < candidates.length; i += 1) {
            var matched = resolveTownFromText(candidates[i])
            if (matched && matched.area_name) {
              return {
                town_name: String(matched.area_name || '').trim(),
                town_code: String(matched.area_code || '').trim()
              }
            }
          }
          // 这里是乡镇场景最后一道兜底：
          // 前面几层都失败时，不再继续从地标名里猜，而是直接使用当前入口乡镇上下文。
          // 这样像“雨宸服饰有限公司”“前楼村卫生室”这类只返回地标名的点，也不会把乡镇丢掉。
          if (theme === 'town' && (currentTownName || currentTownCode)) {
            return {
              town_name: currentTownName,
              town_code: currentTownCode
            }
          }
          return null
        }

        function applyResolvedTownAreaToItem(item, resolvedTownArea) {
          var normalized = Object.assign({}, item || {})
          if (!resolvedTownArea) return normalized
          if (!String(normalized.town || '').trim() && resolvedTownArea.town_name) {
            normalized.town = String(resolvedTownArea.town_name).trim()
          }
          if (resolvedTownArea.town_code) {
            if (!String(normalized.town_code || '').trim()) {
              normalized.town_code = String(resolvedTownArea.town_code).trim()
            }
            if (!String(normalized.area_code || '').trim()) {
              normalized.area_code = String(resolvedTownArea.town_code).trim()
            }
          }
          return normalized
        }

        function applyResolvedTownAreaToItems(items, resolvedTownArea) {
          return (Array.isArray(items) ? items : []).map(function (item) {
            return applyResolvedTownAreaToItem(item, resolvedTownArea)
          })
        }

        function requestTownAreaByWgs(wgsPoint) {
          if (theme !== 'town') {
            return Promise.resolve(null)
          }
          if (!wgsPoint || wgsPoint.lng == null || wgsPoint.lat == null) {
            return Promise.resolve(null)
          }
          return apiGet('/api/common/service-areas/resolve-by-location', {
            lng: wgsPoint.lng,
            lat: wgsPoint.lat,
            area_type: 'town'
          }).then(function (payload) {
            return normalizeResolvedTownArea(payload)
          }).catch(function () {
            return null
          })
        }

        function buildReversePoiItem(raw, reverseInfo, fallbackGcjLat, fallbackGcjLng) {
          raw = raw || {}
          reverseInfo = reverseInfo || {}
          var location = raw.location || raw.latLng || raw.position || {}
          var gcjLng = toFiniteNumber(
            raw.gcj_longitude != null
              ? raw.gcj_longitude
              : raw.longitude != null
                ? raw.longitude
                : typeof location.getLng === 'function'
                  ? location.getLng()
                  : location.lng
          )
          var gcjLat = toFiniteNumber(
            raw.gcj_latitude != null
              ? raw.gcj_latitude
              : raw.latitude != null
                ? raw.latitude
                : typeof location.getLat === 'function'
                  ? location.getLat()
                  : location.lat
          )
          if (gcjLng == null) gcjLng = toFiniteNumber(fallbackGcjLng)
          if (gcjLat == null) gcjLat = toFiniteNumber(fallbackGcjLat)
          if (!isUsableCoordinate(gcjLng, gcjLat)) {
            return null
          }
          var wgsPoint = gcj02ToWgs84(gcjLng, gcjLat)
          var title = String(raw.title || raw.name || raw.address || reverseInfo.address || '位置').trim()
          var address = String(raw.address || raw.addr || title || reverseInfo.address || '').trim()
          return {
            title: title || address || '位置',
            address: address || title || reverseInfo.address || '位置',
            name: title || address || '位置',
            longitude: wgsPoint.lng,
            latitude: wgsPoint.lat,
            gcj_longitude: gcjLng,
            gcj_latitude: gcjLat,
            coord_type: 'wgs84',
            province: String(raw.province || reverseInfo.province || '').trim(),
            city: String(raw.city || reverseInfo.city || '').trim(),
            district: String(raw.district || reverseInfo.district || '').trim(),
            town: String(raw.town || reverseInfo.town || extractTown(address) || '').trim(),
            street: String(raw.street || reverseInfo.street || '').trim(),
            source: String(raw.source || 'reverse_poi').trim()
          }
        }

        function extractReversePoiItems(payload, reverseInfo, gcjLat, gcjLng) {
          var result = payload && payload.result ? payload.result : {}
          var pois = Array.isArray(result.pois) ? result.pois : []
          var mapped = []
          var seen = {}

          function pushItem(item) {
            if (!item) return
            var lng = toFiniteNumber(item.gcj_longitude)
            var lat = toFiniteNumber(item.gcj_latitude)
            if (!isUsableCoordinate(lng, lat)) return
            var key = [
              String(item.title || item.name || item.address || '').trim(),
              String(item.address || '').trim(),
              lng != null ? lng.toFixed(6) : '',
              lat != null ? lat.toFixed(6) : ''
            ].join('|')
            if (seen[key]) return
            seen[key] = true
            mapped.push(item)
          }

          pois.forEach(function (poi) {
            pushItem(buildReversePoiItem(poi, reverseInfo, gcjLat, gcjLng))
          })

          if (!mapped.length) {
            pushItem(
              buildReversePoiItem(
                {
                  title: reverseInfo.address || '当前位置',
                  address: reverseInfo.address || '当前位置',
                  gcj_latitude: gcjLat,
                  gcj_longitude: gcjLng,
                  province: reverseInfo.province,
                  city: reverseInfo.city,
                  district: reverseInfo.district,
                  town: reverseInfo.town,
                  street: reverseInfo.street,
                  source: 'reverse_geocode'
                },
                reverseInfo,
                gcjLat,
                gcjLng
              )
            )
          }

          return mapped
        }

        function hasUsefulNearbyItems(items) {
          var list = Array.isArray(items) ? items : []
          if (list.length >= 3) return true
          return list.some(function (item) {
            var source = String(item && item.source || '').trim()
            return source && source !== 'reverse_geocode' && source !== 'reverse_fallback'
          })
        }

        function mergeSuggestionItems() {
          var merged = []
          var seen = {}

          function pushItem(item) {
            if (!item) return
            var lng = toFiniteNumber(item.gcj_longitude != null ? item.gcj_longitude : item.longitude)
            var lat = toFiniteNumber(item.gcj_latitude != null ? item.gcj_latitude : item.latitude)
            var key = [
              String(item.title || item.name || item.address || '').trim(),
              String(item.address || '').trim(),
              lng != null ? lng.toFixed(6) : '',
              lat != null ? lat.toFixed(6) : ''
            ].join('|')
            if (seen[key]) return
            seen[key] = true
            merged.push(item)
          }

          Array.prototype.slice.call(arguments).forEach(function (items) {
            ;(Array.isArray(items) ? items : []).forEach(pushItem)
          })

          return merged
        }

        function requestNearbyItemsByWgs(wgsPoint) {
          if (!wgsPoint || wgsPoint.lng == null || wgsPoint.lat == null) {
            return Promise.resolve([])
          }
          return apiGet('/api/map/nearby', {
            lng: wgsPoint.lng,
            lat: wgsPoint.lat,
            limit: 10,
            radius: 1500
          }).then(function (items) {
            return Array.isArray(items) ? items : []
          }).catch(function () {
            return []
          })
        }

        function resolveNearbyItems(gcjLat, gcjLng, reverseInfo, reverseItems, wgsPoint) {
          // 正常情况下逆地理接口会直接带回附近 POI。
          // 如果只拿到“已选位置”这种兜底项，就再按当前坐标查一次附近搜索，避免页面空着等用户手动挪动。
          if (hasUsefulNearbyItems(reverseItems)) {
            return Promise.resolve(reverseItems)
          }
          return requestNearbyItemsByWgs(wgsPoint).then(function (nearbyItems) {
            return mergeSuggestionItems(reverseItems, nearbyItems)
          })
        }

        function buildSelectionFromItem(item, reverseData, resolvedTownArea) {
          var gcjLng = toFiniteNumber(item && item.gcj_longitude)
          var gcjLat = toFiniteNumber(item && item.gcj_latitude)
          var wgsLng = toFiniteNumber(item && item.longitude)
          var wgsLat = toFiniteNumber(item && item.latitude)
          if ((wgsLng == null || wgsLat == null) && gcjLng != null && gcjLat != null) {
            var wgsPoint = gcj02ToWgs84(gcjLng, gcjLat)
            wgsLng = wgsPoint.lng
            wgsLat = wgsPoint.lat
          }
          var reverseInfo = reverseData || {}
          var title = String(item && item.title || '').trim()
          var address = String(item && item.address || reverseInfo.address || title).trim()
          return {
            title: title || address,
            address: address || title,
            name: title || address,
            longitude: wgsLng,
            latitude: wgsLat,
            gcj_longitude: gcjLng,
            gcj_latitude: gcjLat,
            coord_type: 'wgs84',
            province: String(reverseInfo.province || item && item.province || '').trim(),
            city: String(reverseInfo.city || item && item.city || '').trim(),
            district: String(reverseInfo.district || item && item.district || '').trim(),
            town: String(
              resolvedTownArea && resolvedTownArea.town_name ||
              reverseInfo.town ||
              item && item.town ||
              ''
            ).trim(),
            town_code: String(
              resolvedTownArea && resolvedTownArea.town_code ||
              item && (item.town_code || item.area_code) ||
              ''
            ).trim(),
            area_code: String(
              resolvedTownArea && resolvedTownArea.town_code ||
              item && (item.area_code || item.town_code) ||
              ''
            ).trim(),
            street: String(reverseInfo.street || '').trim(),
            source: String(item && item.source || 'user_remote_map_picker').trim()
          }
        }

        function buildSelectionFromCenter(gcjLat, gcjLng, reverseData, fallbackItem, resolvedTownArea) {
          var reverseInfo = reverseData || {}
          var wgsPoint = gcj02ToWgs84(gcjLng, gcjLat)
          var fallbackTitle = String(
            fallbackItem && (fallbackItem.title || fallbackItem.name || fallbackItem.address) || ''
          ).trim()
          var fallbackAddress = String(
            fallbackItem && (fallbackItem.address || fallbackItem.title || fallbackItem.name) || ''
          ).trim()
          var finalAddress = String(reverseInfo.address || fallbackAddress || fallbackTitle || '已选位置').trim()
          var finalTitle = String(fallbackTitle || reverseInfo.address || fallbackAddress || '已选位置').trim()
          return {
            title: finalTitle || finalAddress || '已选位置',
            address: finalAddress || finalTitle || '已选位置',
            name: finalTitle || finalAddress || '已选位置',
            longitude: wgsPoint.lng,
            latitude: wgsPoint.lat,
            gcj_longitude: gcjLng,
            gcj_latitude: gcjLat,
            coord_type: 'wgs84',
            province: String(reverseInfo.province || fallbackItem && fallbackItem.province || '').trim(),
            city: String(reverseInfo.city || fallbackItem && fallbackItem.city || '').trim(),
            district: String(reverseInfo.district || fallbackItem && fallbackItem.district || '').trim(),
            town: String(
              resolvedTownArea && resolvedTownArea.town_name ||
              reverseInfo.town ||
              fallbackItem && fallbackItem.town ||
              ''
            ).trim(),
            town_code: String(
              resolvedTownArea && resolvedTownArea.town_code ||
              fallbackItem && (fallbackItem.town_code || fallbackItem.area_code) ||
              ''
            ).trim(),
            area_code: String(
              resolvedTownArea && resolvedTownArea.town_code ||
              fallbackItem && (fallbackItem.area_code || fallbackItem.town_code) ||
              ''
            ).trim(),
            street: String(reverseInfo.street || fallbackItem && fallbackItem.street || '').trim(),
            source: 'user_remote_map_picker_center'
          }
        }

        function updateSelection(selection, statusText) {
          selectedLocation = selection
          setAddress(selection && selection.address || selection && selection.title || '请选择位置')
          setCoords(selection && selection.latitude, selection && selection.longitude)
          setStatus(statusText)
          setConfirmEnabled(Boolean(selection && selection.longitude != null && selection.latitude != null))
          renderSuggestions(suggestListEl._rawItems || [], '输入地址后会显示联想位置')
        }

        function getInitialCenter() {
          var lat = toFiniteNumber(getQuery('latitude'))
          var lng = toFiniteNumber(getQuery('longitude'))
          if (lat != null && lng != null) {
            return { lat: lat, lng: lng }
          }
          return DEFAULT_CENTER
        }

        function getMapCenterGcj() {
          if (!map) return null
          var center = map.getCenter()
          if (!center) return null
          return {
            lat: center.getLat(),
            lng: center.getLng()
          }
        }

        function getMapOffsetFromPin() {
          // 这里不能再拿整个图标容器的底边当锚点。
          // 因为红色图标本身有旋转形状，容器底边和用户眼里的针尖不是同一个像素点。
          // 现在单独用一个透明针尖锚点，让地图取点永远跟着真正的针尖走。
          var pinEl = document.querySelector('.center-pin-tip')
          var mapEl = document.getElementById('mapContainer')
          if (!pinEl || !mapEl) {
            return { x: 0, y: 0 }
          }
          var pinRect = pinEl.getBoundingClientRect()
          var mapRect = mapEl.getBoundingClientRect()
          var anchorX = pinRect.left + pinRect.width / 2 - mapRect.left
          var anchorY = pinRect.top + pinRect.height / 2 - mapRect.top
          return {
            x: anchorX - mapRect.width / 2,
            y: anchorY - mapRect.height / 2
          }
        }

        function syncMapOffsetWithPin() {
          if (!map || typeof map.setOffset !== 'function') return
          var offset = getMapOffsetFromPin()
          map.setOffset(offset)
        }

        function bindWindowEvents() {
          window.addEventListener('resize', function () {
            syncMapOffsetWithPin()
          })
          window.addEventListener('orientationchange', function () {
            syncMapOffsetWithPin()
          })
        }

        function getInitialMapOffset() {
          try {
            return getMapOffsetFromPin()
          } catch (err) {
            return { x: 0, y: 0 }
          }
        }

        function moveMapTo(item) {
          var lat = toFiniteNumber(item && item.gcj_latitude)
          var lng = toFiniteNumber(item && item.gcj_longitude)
          if (!isUsableCoordinate(lng, lat) || !map) return false
          map.easeTo({
            center: new window.TMap.LatLng(lat, lng),
            zoom: 17
          })
          return true
        }

        function loadMapScript() {
          return new Promise(function (resolve, reject) {
            if (window.TMap) {
              resolve(window.TMap)
              return
            }
            var key = getQuery('key')
            if (!key) {
              reject(new Error('missing-key'))
              return
            }
            var script = document.createElement('script')
            script.charset = 'utf-8'
            script.src = 'https://map.qq.com/api/gljs?v=1.exp&key=' + encodeURIComponent(key)
            script.onload = function () {
              if (window.TMap) {
                resolve(window.TMap)
                return
              }
              reject(new Error('tmap-unavailable'))
            }
            script.onerror = function () {
              reject(new Error('script-load-failed'))
            }
            document.head.appendChild(script)
          })
        }

        function renderSuggestions(items, emptyText) {
          suggestListEl._rawItems = Array.isArray(items) ? items : []
          clearSuggestList()
          var displayItems = buildDisplayItems(suggestListEl._rawItems)
          if (!displayItems.length) {
            setSuggestState(emptyText || '未找到相关位置，换个词试试')
            showSuggestPanel(true)
            return
          }

          setSuggestState('')
          var html = displayItems
            .map(function (item, index) {
              var active = isActiveSuggestionItem(item)
              return (
                '<div class="suggest-item' + (active ? ' active' : '') + '" data-index="' +
                index +
                '">' +
                '<div class="suggest-main">' +
                '<div class="suggest-title-row">' +
                '<div class="suggest-title">' +
                escapeHtml(item.title || item.address || '未命名位置') +
                '</div>' +
                (active ? '<div class="suggest-check">✓</div>' : '') +
                '</div>' +
                '<div class="suggest-address">' +
                escapeHtml(item.display_address || item.address || '暂无详细地址') +
                '</div>' +
                '</div>' +
                '</div>'
              )
            })
            .join('')
          suggestListEl.innerHTML = html
          suggestListEl._items = displayItems
          showSuggestPanel(true)
        }

        function normalizeSearchText(value) {
          return String(value || '').trim().replace(/\s+/g, '').toLowerCase()
        }

        function scoreSuggestionItem(item, keyword) {
          var keywordText = normalizeSearchText(keyword)
          var title = normalizeSearchText(item && item.title)
          var address = normalizeSearchText(item && item.address)
          var score = 0

          if (!keywordText) {
            return 0
          }
          if (title === keywordText) score += 120
          if (address === keywordText) score += 110
          if (title && keywordText && title.indexOf(keywordText) !== -1) score += 70
          if (address && keywordText && address.indexOf(keywordText) !== -1) score += 50
          if (title && keywordText && keywordText.indexOf(title) !== -1) score += 30
          if (address && keywordText && keywordText.indexOf(address) !== -1) score += 20
          if (String(item && item.source || '').trim() === 'service_area') score -= 15
          return score
        }

        function pickBestSuggestionItem(items, keyword) {
          var list = Array.isArray(items) ? items : []
          if (!list.length) {
            return null
          }
          var bestItem = list[0]
          var bestScore = scoreSuggestionItem(bestItem, keyword)
          for (var i = 1; i < list.length; i += 1) {
            var current = list[i]
            var currentScore = scoreSuggestionItem(current, keyword)
            if (currentScore > bestScore) {
              bestItem = current
              bestScore = currentScore
            }
          }
          return bestItem
        }

        function isStaleCenterRefresh(refreshToken) {
          return refreshToken && refreshToken !== lastCenterRefreshToken
        }

        function fetchReverseByGcj(gcjLat, gcjLng, sourceText, options) {
          options = options || {}
          var wgsPoint = gcj02ToWgs84(gcjLng, gcjLat)
          if (wgsPoint.lng == null || wgsPoint.lat == null) {
            return Promise.resolve(null)
          }
          setStatus('正在识别地址...')
          return apiGet('/api/map/reverse-geocode', {
            lng: wgsPoint.lng,
            lat: wgsPoint.lat
          })
            .then(function (payload) {
              if (isStaleCenterRefresh(options.refreshToken)) {
                return null
              }
              var reverseInfo = extractReverseAddress(payload || {})
              var nearbyItems = extractReversePoiItems(payload || {}, reverseInfo, gcjLat, gcjLng)
              return Promise.all([
                resolveNearbyItems(gcjLat, gcjLng, reverseInfo, nearbyItems, wgsPoint),
                requestTownAreaByWgs(wgsPoint)
              ]).then(function (results) {
                var finalNearbyItems = Array.isArray(results[0]) ? results[0] : []
                var resolvedTownArea = deriveResolvedTownArea(reverseInfo, finalNearbyItems, results[1])
                  if (isStaleCenterRefresh(options.refreshToken)) {
                    return null
                  }
                  finalNearbyItems = applyResolvedTownAreaToItems(finalNearbyItems, resolvedTownArea)
                  suggestListEl._rawItems = finalNearbyItems
                  // 这里不能再把最近 POI 的坐标当成最终提交坐标。
                  // 用户拖红色指针选的是“地图中心点”，不是“最近地标”。
                  // 所以这一步只借 finalNearbyItems[0] 补文案，真正保存的经纬度必须继续跟着中心点走。
                  updateSelection(
                    buildSelectionFromCenter(gcjLat, gcjLng, reverseInfo, finalNearbyItems[0] || null, resolvedTownArea),
                    sourceText || '当前位置已更新'
                  )
                  return {
                    reverseInfo: reverseInfo,
                    resolvedTownArea: resolvedTownArea
                  }
                })
            })
            .catch(function () {
              if (isStaleCenterRefresh(options.refreshToken)) {
                return null
              }
              if (options.retryCount !== 1) {
                return wait(350).then(function () {
                  return fetchReverseByGcj(gcjLat, gcjLng, sourceText, Object.assign({}, options, { retryCount: 1 }))
                })
              }
              return requestNearbyItemsByWgs(wgsPoint).then(function (nearbyItems) {
                if (isStaleCenterRefresh(options.refreshToken)) {
                  return null
                }
                return requestTownAreaByWgs(wgsPoint).then(function (resolvedTownArea) {
                  if (isStaleCenterRefresh(options.refreshToken)) {
                    return null
                  }
                  resolvedTownArea = deriveResolvedTownArea(nearbyItems[0] || {}, nearbyItems, resolvedTownArea)
                  nearbyItems = applyResolvedTownAreaToItems(nearbyItems, resolvedTownArea)
                  suggestListEl._rawItems = nearbyItems
                  updateSelection(
                    buildSelectionFromItem(
                      {
                        title: nearbyItems[0] && nearbyItems[0].title || '已选位置',
                        address: nearbyItems[0] && nearbyItems[0].address || '已选位置',
                        longitude: wgsPoint.lng,
                        latitude: wgsPoint.lat,
                        gcj_longitude: gcjLng,
                        gcj_latitude: gcjLat,
                        source: 'reverse_fallback'
                      },
                      nearbyItems[0] || {},
                      resolvedTownArea
                    ),
                    nearbyItems.length ? '已加载附近位置' : '地址识别失败，请确认后手动补充门牌号'
                  )
                  return {
                    reverseInfo: nearbyItems[0] || {},
                    resolvedTownArea: resolvedTownArea
                  }
                })
              })
            })
        }

        function refreshCenterByGcj(gcjLat, gcjLng, sourceText) {
          var refreshToken = String(Date.now()) + '-' + Math.random().toString(16).slice(2)
          lastCenterRefreshToken = refreshToken
          setSuggestState('正在加载附近位置...')
          clearSuggestList()
          showSuggestPanel(true)
          return fetchReverseByGcj(gcjLat, gcjLng, sourceText, {
            refreshToken: refreshToken,
            retryCount: 0
          })
        }

        function requestSuggestions(keyword, mode) {
          var searchText = String(keyword || '').trim()
          if (!searchText) {
            setSuggestState('输入地址后会显示联想位置')
            renderSuggestions([], '输入地址后会显示联想位置')
            return
          }

          var center = getMapCenterGcj()
          var wgsCenter = center ? gcj02ToWgs84(center.lng, center.lat) : { lng: null, lat: null }
          var token = Date.now()
          lastSearchToken = token
          setSuggestState(mode === 'search' ? '正在搜索...' : '正在联想位置...')
          clearSuggestList()
          showSuggestPanel(true)

          var requestParams = {
            keyword: searchText,
            lng: wgsCenter.lng,
            lat: wgsCenter.lat,
            limit: mode === 'search' ? 10 : 8
          }

          apiGet(mode === 'search' ? '/api/map/search' : '/api/map/suggest', requestParams)
            .then(function (items) {
              var list = Array.isArray(items) ? items : []
              if (mode !== 'search') {
                return {
                  items: list,
                  mode: mode
                }
              }
              var bestPrimaryItem = pickBestSuggestionItem(list, searchText)
              var bestPrimaryScore = scoreSuggestionItem(bestPrimaryItem, searchText)
              if (list.length && bestPrimaryScore >= 60) {
                return {
                  items: list,
                  mode: mode
                }
              }
              return apiGet('/api/map/suggest', {
                keyword: searchText,
                lng: wgsCenter.lng,
                lat: wgsCenter.lat,
                limit: 8
              }).then(function (fallbackItems) {
                var suggestItems = Array.isArray(fallbackItems) ? fallbackItems : []
                return {
                  items: list.concat(suggestItems),
                  mode: 'search_fallback'
                }
              })
            })
            .then(function (result) {
              if (token !== lastSearchToken || !result) return
              var items = Array.isArray(result.items) ? result.items : []
              if (mode === 'search') {
                if (!items.length) {
                  renderSuggestions([], '未找到相关位置，换个关键词试试')
                  return
                }
                suggestListEl._rawItems = items
                suggestListEl._items = items
                var bestItem = pickBestSuggestionItem(items, searchText)
                if (!bestItem) {
                  renderSuggestions(items, '未找到相关位置，换个关键词试试')
                  return
                }
                locateSuggestionItem(
                  bestItem,
                  result.mode === 'search_fallback' ? '已根据联想结果定位' : '已定位到搜索结果'
                )
                return
              }
              renderSuggestions(items, '未找到相关位置，换个关键词试试')
            })
            .catch(function (error) {
              if (token !== lastSearchToken) return
              setSuggestState((error && error.message) || '搜索服务暂不可用')
              clearSuggestList()
              showSuggestPanel(true)
            })
        }

        function locateSuggestionItem(item, sourceText) {
          if (!item) {
            return Promise.resolve(false)
          }
          if (!isUsableCoordinate(item && item.gcj_longitude, item && item.gcj_latitude)) {
            setStatus('该位置坐标异常，请换一个结果重试')
            setAddress(String(item.title || item.address || '该位置暂不可用'))
            setCoords(null, null)
            setConfirmEnabled(false)
            return Promise.resolve(false)
          }
          searchInputEl.value = item.title || item.address || ''
          showSuggestPanel(false)
          moveMapTo(item)
          return fetchReverseByGcj(item.gcj_latitude, item.gcj_longitude, sourceText || '已定位到搜索结果')
            .then(function (result) {
              updateSelection(
                buildSelectionFromItem(
                  item,
                  result && result.reverseInfo || {},
                  result && result.resolvedTownArea || null
                ),
                sourceText || '已定位到搜索结果'
              )
              return true
            })
        }

        function handleSuggestSelect(index) {
          var items = suggestListEl._items || []
          var item = items[index]
          if (!item) return
          locateSuggestionItem(item, '已定位到搜索结果')
        }

        function postSelectedLocation(location) {
          if (window.uni && typeof window.uni.postMessage === 'function') {
            window.uni.postMessage({
              data: {
                action: 'locationPicked',
                payload: location
              }
            })
            return true
          }
          return postSelectedLocationByStorage(location)
        }

        function postSelectedLocationByStorage(location) {
          if (!location || !window.plus || !window.plus.storage) {
            return false
          }
          try {
            window.plus.storage.setItem(
              APP_MAP_PICKER_BRIDGE_STORAGE_KEY,
              JSON.stringify({
                action: 'locationPicked',
                payload: location,
                token: String(Date.now()) + '-' + Math.random().toString(16).slice(2)
              })
            )
            return true
          } catch (error) {
            return false
          }
        }

        function bindSearchEvents() {
          searchInputEl.addEventListener('input', function (event) {
            var keyword = event && event.target ? event.target.value : ''
            if (searchTimer) {
              clearTimeout(searchTimer)
            }
            searchTimer = setTimeout(function () {
              requestSuggestions(keyword, 'suggest')
            }, 260)
          })
          searchInputEl.addEventListener('focus', function () {
            var keyword = searchInputEl.value
            if (String(keyword || '').trim()) {
              requestSuggestions(keyword, 'suggest')
            }
          })
          searchInputEl.addEventListener('keydown', function (event) {
            if (event && event.key === 'Enter') {
              if (typeof event.preventDefault === 'function') {
                event.preventDefault()
              }
              requestSuggestions(searchInputEl.value, 'search')
            }
          })
          searchBtnEl.addEventListener('click', function () {
            requestSuggestions(searchInputEl.value, 'search')
          })
          suggestListEl.addEventListener('click', function (event) {
            var node = event.target
            while (node && node !== suggestListEl && !node.getAttribute('data-index')) {
              node = node.parentNode
            }
            if (!node || node === suggestListEl) return
            var index = Number(node.getAttribute('data-index'))
            if (!isFinite(index)) return
            handleSuggestSelect(index)
          })
        }

        function bindMapEvents() {
          function clearCenterSyncTimers() {
            if (centerSyncTimer) {
              clearTimeout(centerSyncTimer)
              centerSyncTimer = null
            }
            if (zoomTailSyncTimer) {
              clearTimeout(zoomTailSyncTimer)
              zoomTailSyncTimer = null
            }
          }

          function scheduleRefreshFromCurrentCenter(statusText, delay) {
            clearTimeout(centerSyncTimer)
            centerSyncTimer = setTimeout(function () {
              var center = getMapCenterGcj()
              if (!center) return
              refreshCenterByGcj(center.lat, center.lng, statusText || '当前位置已更新')
            }, delay)
          }

          function getCurrentZoomLevel() {
            if (!map || typeof map.getZoom !== 'function') return lastZoomLevel
            var zoom = Number(map.getZoom())
            return isFinite(zoom) ? zoom : lastZoomLevel
          }

          function refreshFromCurrentCenter(statusText) {
            var center = getMapCenterGcj()
            if (!center) return Promise.resolve(null)
            return refreshCenterByGcj(center.lat, center.lng, statusText || '当前位置已更新')
          }

          map.on('dragstart', function () {
            isDragging = true
            setStatus('地图拖动中...')
          })
          map.on('dragend', function () {
            isDragging = false
            clearCenterSyncTimers()
            // #region debug-point B:dragend
            reportDebugPoint('B', 'user.html:dragend', '拖动结束，准备同步中心点', {
              zoom: getCurrentZoomLevel(),
              center: getMapCenterGcj()
            })
            // #endregion
            scheduleRefreshFromCurrentCenter('当前位置已更新', 120)
          })
          map.on('zoomend', function () {
            // 现在默认比例和放大都已经基本正常，缩小时还会有一小段收尾位移。
            // 所以这里保留第一拍同步，同时在“缩小地图”时多补一拍尾同步，
            // 只修缩小后还会继续滑一下导致的中心点滞后，不去动已经正常的放大逻辑。
            var currentZoom = getCurrentZoomLevel()
            var isZoomOut = currentZoom < lastZoomLevel
            clearCenterSyncTimers()
            // #region debug-point A:zoomend
            reportDebugPoint('A', 'user.html:zoomend', '缩放结束', {
              prev_zoom: lastZoomLevel,
              current_zoom: currentZoom,
              is_zoom_out: isZoomOut,
              center: getMapCenterGcj()
            })
            // #endregion
            scheduleRefreshFromCurrentCenter('缩放后位置已更新', 120)
            if (isZoomOut) {
              zoomTailSyncTimer = setTimeout(function () {
                // #region debug-point A:zoom-tail
                reportDebugPoint('A', 'user.html:zoomTailSync', '缩小尾同步触发', {
                  zoom: getCurrentZoomLevel(),
                  center: getMapCenterGcj()
                })
                // #endregion
                refreshFromCurrentCenter('缩小后位置已更新')
              }, 420)
            }
            lastZoomLevel = currentZoom
          })
        }

        function handleConfirm() {
          setStatus('正在确认位置...')
          var center = getMapCenterGcj()
          if (!center) {
            setStatus('当前位置读取失败，请稍后重试')
            return
          }
          // #region debug-point C:confirm-click
          reportDebugPoint('C', 'user.html:handleConfirm', '点击确认位置', {
            zoom: typeof map.getZoom === 'function' ? Number(map.getZoom()) : null,
            center: center,
            selected_before: selectedLocation
              ? {
                  longitude: selectedLocation.longitude,
                  latitude: selectedLocation.latitude,
                  gcj_longitude: selectedLocation.gcj_longitude,
                  gcj_latitude: selectedLocation.gcj_latitude
                }
              : null
          })
          // #endregion
          // 确认前再强制按地图当前中心点刷新一次，
          // 避免缩放事件刚结束时 selectedLocation 还停留在上一帧中心。
          refreshCenterByGcj(center.lat, center.lng, '正在确认当前位置...')
            .then(function () {
              if (!selectedLocation) {
                setStatus('当前位置识别失败，请稍后重试')
                return
              }
              // #region debug-point D:confirm-after-refresh
              reportDebugPoint('D', 'user.html:handleConfirm.then', '确认前刷新完成', {
                zoom: typeof map.getZoom === 'function' ? Number(map.getZoom()) : null,
                center_after: getMapCenterGcj(),
                selected_after: {
                  longitude: selectedLocation.longitude,
                  latitude: selectedLocation.latitude,
                  gcj_longitude: selectedLocation.gcj_longitude,
                  gcj_latitude: selectedLocation.gcj_latitude
                }
              })
              // #endregion
              if (postSelectedLocation(selectedLocation)) {
                // #region debug-point E:confirm-post
                reportDebugPoint('E', 'user.html:postSelectedLocation', '确认结果已回传宿主页面', {
                  payload: {
                    longitude: selectedLocation.longitude,
                    latitude: selectedLocation.latitude,
                    gcj_longitude: selectedLocation.gcj_longitude,
                    gcj_latitude: selectedLocation.gcj_latitude
                  }
                })
                // #endregion
                return
              }
              setStatus('页面通信未就绪，请稍后再试')
            })
            .catch(function () {
              setStatus('当前位置识别失败，请稍后重试')
            })
        }

        function initMap() {
          var center = getInitialCenter()
          var mapOffset = getInitialMapOffset()
          var initialAddress = String(getQuery('address') || '').trim()
          if (initialAddress) {
            searchInputEl.value = initialAddress
          }
          map = new window.TMap.Map(document.getElementById('mapContainer'), {
            center: new window.TMap.LatLng(center.lat, center.lng),
            zoom: 17,
            pitch: 0,
            rotation: 0,
            // 页面上的选点针是放在上半屏的，不在几何中心。
            // 这里直接把地图显示中心偏移到针尖下方，这样 getCenter()、确认位置、重新打开地图三者就保持同一个点。
            offset: mapOffset
          })
          lastZoomLevel = typeof map.getZoom === 'function' ? Number(map.getZoom()) || 17 : 17
          // #region debug-point B:init-map
          reportDebugPoint('B', 'user.html:initMap', '地图初始化完成', {
            init_center_lng: center.lng,
            init_center_lat: center.lat,
            init_zoom: lastZoomLevel,
            offset_x: mapOffset && mapOffset.x,
            offset_y: mapOffset && mapOffset.y
          })
          // #endregion

          bindSearchEvents()
          bindMapEvents()
          bindWindowEvents()
          confirmBtnEl.addEventListener('click', handleConfirm)
          setLoading(false)
          refreshCenterByGcj(center.lat, center.lng, '已定位到当前位置')
        }

        loadMapScript()
          .then(initMap)
          .catch(function (error) {
            setLoading(false)
            setConfirmEnabled(false)
            if (error && error.message === 'missing-key') {
              setStatus('腾讯地图 key 未配置，请先检查前端地图 key')
              setAddress('地图 key 缺失')
              return
            }
            setStatus('腾讯地图加载失败，请检查远端静态页和 key 配置')
            setAddress('地图加载失败')
          })
      })()
    </script>
  </body>
</html>
